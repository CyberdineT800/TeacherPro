<!DOCTYPE html>
<html lang="{{ current_language }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22none%22 stroke=%22%2366e0ff%22 stroke-width=%226%22/><text x=%2250%22 y=%2260%22 font-size=%2240%22 text-anchor=%22middle%22 fill=%22%23ffffff%22 font-family=%22Arial%22 font-weight=%22700%22>T</text></svg>">
    <title>{{ _('login') }} — {{ _('app_name') }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Login-specific layout overrides (builds on the shared design system) */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 32px 20px;
        }

        .login-shell {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .login-container {
            padding: 44px 38px 38px;
            border-radius: var(--r-xl);
            background: rgba(255, 255, 255, 0.055);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            box-shadow: var(--sh-lg), var(--glass-inner);
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        .login-container::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(140deg, rgba(255,255,255,.30) 0%, rgba(255,255,255,.04) 35%, transparent 65%, rgba(255,255,255,.10) 100%);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
                    mask-composite: exclude;
            pointer-events: none;
        }

        .login-icon {
            width: 74px;
            height: 74px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: conic-gradient(from 140deg, var(--c-cyan), var(--c-violet), var(--c-teal), var(--c-cyan));
            display: grid;
            place-items: center;
            box-shadow: 0 10px 40px oklch(65% 0.2 260 / 0.45), var(--glass-inner);
            position: relative;
        }
        .login-icon::after {
            content: "";
            position: absolute;
            inset: 8px;
            border-radius: 50%;
            background: radial-gradient(120% 80% at 30% 15%, rgba(255,255,255,.85), rgba(255,255,255,.1) 45%, transparent 70%);
            mix-blend-mode: overlay;
        }
        .login-icon svg { position: relative; z-index: 1; }

        .login-container h1 {
            font-size: 1.7rem;
            font-weight: 800;
            margin-bottom: 4px;
            letter-spacing: -0.02em;
        }
        .login-subtitle {
            font-size: 0.92rem;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        .login-container .form-group { text-align: left; }

        .login-container .btn {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            font-size: 0.95rem;
        }

        /* Compact language row on login */
        .login-languages {
            display: flex;
            gap: 8px;
            padding: 6px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--glass-border);
            border-radius: var(--r-pill);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            justify-content: center;
            align-self: center;
        }

        .login-lang-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border: 1px solid transparent;
            border-radius: var(--r-pill);
            background: transparent;
            color: var(--text-muted);
            font: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s var(--ease);
        }
        .login-lang-btn:hover {
            color: var(--text);
            background: rgba(255,255,255,.06);
        }
        .login-lang-btn.active {
            color: var(--text);
            background: var(--glass-bg-strong);
            border-color: var(--glass-border);
            box-shadow: var(--glass-inner);
        }
        .login-lang-btn .language-flag { font-size: 1rem; }

        .login-footer-strip {
            margin-top: 10px;
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-faint);
        }
        .login-footer-strip a {
            color: var(--text-muted);
            margin: 0 4px;
        }
    </style>
</head>

<body>
    <div class="bg-grain" aria-hidden="true"></div>

    <div class="login-shell">
        <div class="login-container">
            <div class="login-icon" aria-hidden="true">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 8l9-5 9 5-9 5-9-5z" stroke="#0a0e1c" stroke-width="2" stroke-linejoin="round"/>
                    <path d="M7 10.5V15c0 1.5 2.5 3 5 3s5-1.5 5-3v-4.5" stroke="#0a0e1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>

            <h1>{{ _('app_name') }}</h1>
            <p class="login-subtitle">{{ _('login') }}</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label for="username">{{ _('username') }}</label>
                    <input type="text" id="username" name="username" required autofocus autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">{{ _('password') }}</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary">{{ _('login') }}</button>
            </form>
        </div>

        <div class="login-languages" role="group" aria-label="{{ _('select_language') }}">
            <button type="button" onclick="changeLanguage('uz')"
                class="login-lang-btn {% if current_language == 'uz' %}active{% endif %}">
                <span class="language-flag">🇺🇿</span>
                <span>O'zbek</span>
            </button>
            <button type="button" onclick="changeLanguage('ru')"
                class="login-lang-btn {% if current_language == 'ru' %}active{% endif %}">
                <span class="language-flag">🇷🇺</span>
                <span>Русский</span>
            </button>
            <button type="button" onclick="changeLanguage('en')"
                class="login-lang-btn {% if current_language == 'en' %}active{% endif %}">
                <span class="language-flag">🇬🇧</span>
                <span>English</span>
            </button>
        </div>

        <div class="login-footer-strip">
            &copy; 2025 {{ _('app_name') }} ·
            <a href="https://t.me/AbdJavohir" target="_blank" rel="noopener">@AbdJavohir</a> ·
            <a href="https://t.me/Teacher_Asrorbey" target="_blank" rel="noopener">@Teacher_Asrorbey</a>
        </div>
    </div>

    <script>window.ROOT_PATH = "{{ request.app.root_path }}";</script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
