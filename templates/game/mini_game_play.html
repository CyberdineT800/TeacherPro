<!DOCTYPE html>
<html lang="{{ current_language }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ _(game_title_key) }} — TeacherPro</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22none%22 stroke=%22%2366e0ff%22 stroke-width=%226%22/><text x=%2250%22 y=%2260%22 font-size=%2240%22 text-anchor=%22middle%22 fill=%22%23ffffff%22 font-family=%22Arial%22 font-weight=%22700%22>T</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>
(function(){
  var t=localStorage.getItem('theme');
  if(!t) t=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-0:#06080f;--bg-1:#0a0e1a;
  --cyan:#7cdaff;--violet:#b8a0ff;--teal:#3ee8c0;
  --text:#e8eef7;--text-2:#c6d2e0;--muted:#7e95ad;
  --hair:rgba(255,255,255,.07);--hair-2:rgba(255,255,255,.13);
  --glass:rgba(255,255,255,.045);--glass-h:rgba(255,255,255,.075);
  --ring:0 1px 0 0 rgba(255,255,255,.12) inset,0 -1px 0 0 rgba(255,255,255,.04) inset;
  --r-sm:10px;--r-md:16px;--r-lg:22px;--r-pill:999px;
  --sh-lg:0 20px 60px rgba(0,0,0,.4);
  --ease:cubic-bezier(.22,1,.36,1);
}
[data-theme="light"]{
  --bg-0:#eef2f9;--bg-1:#f4f7fc;
  --cyan:#0b8fcc;--violet:#7d5cff;--teal:#0bb88e;
  --text:#0a1424;--text-2:#27384c;--muted:#506478;
  --hair:rgba(0,30,80,.09);--hair-2:rgba(0,30,80,.18);
  --glass:rgba(255,255,255,.55);--glass-h:rgba(255,255,255,.75);
  --ring:0 1px 0 0 rgba(255,255,255,.9) inset,0 -1px 0 0 rgba(0,30,80,.05) inset;
  --sh-lg:0 12px 40px rgba(0,30,80,.12);
}

html,body{height:100%;overflow:hidden}
body{
  background:var(--bg-0);color:var(--text);
  font-family:'Manrope',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
}

.mgp-wrap{flex:1;display:flex;flex-direction:column;padding:.85rem 1.25rem 1rem;overflow:hidden}

.mgp-bar{
  display:flex;align-items:center;gap:.75rem;
  margin-bottom:.85rem;flex-wrap:wrap;flex-shrink:0;
}

.mgp-back{
  display:inline-flex;align-items:center;gap:.4rem;
  padding:.35rem .85rem;border-radius:var(--r-pill);
  font-size:.84rem;font-weight:600;color:var(--cyan);
  border:1px solid rgba(100,200,255,.25);
  background:rgba(100,200,255,.07);
  text-decoration:none;transition:.18s;
}
.mgp-back:hover{background:rgba(100,200,255,.14);border-color:var(--cyan)}
.mgp-back svg{flex-shrink:0}

.mgp-title{font-size:1rem;font-weight:700;margin:0;color:var(--text)}

.mgp-badge{
  font-size:.73rem;font-weight:700;padding:.18rem .6rem;
  border-radius:var(--r-pill);
  background:rgba(100,200,255,.1);color:var(--cyan);
  border:1px solid rgba(100,200,255,.3);
  text-transform:uppercase;letter-spacing:.04em;margin-left:auto;
}

.mgp-fs-btn{
  flex-shrink:0;padding:.4rem .55rem;border-radius:var(--r-sm);
  background:rgba(100,200,255,.1);border:1px solid rgba(100,200,255,.25);
  color:var(--cyan);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  transition:.15s;
}
.mgp-fs-btn:hover{background:rgba(100,200,255,.2)}

.mgp-card{
  flex:1;
  position:relative;border-radius:var(--r-lg);
  border:1px solid var(--hair-2);
  background:var(--glass);
  box-shadow:var(--sh-lg);
  overflow:hidden;
  min-height:0;
}
.mgp-card:fullscreen,.mgp-card:-webkit-full-screen{
  border-radius:0;height:100vh;width:100vw;
}
.mgp-iframe{
  width:100%;height:100%;border:none;background:#fff;display:block;
}
</style>
</head>
<body>
<div class="mgp-wrap">
  <div class="mgp-bar">
    <a href="{{ root_path }}/games" class="mgp-back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      {{ _('back_to_games') }}
    </a>
    <h2 class="mgp-title">{{ _(game_title_key) }}</h2>
    <span class="mgp-badge">{{ _('mini_game_label') }}</span>
    <button class="mgp-fs-btn" id="mgpFsBtn" onclick="mgpToggleFs()" title="Fullscreen">
      <svg id="mgpIconExpand" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 7V3h4M21 7V3h-4M3 17v4h4M21 17v4h-4"/>
      </svg>
      <svg id="mgpIconCollapse" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
        <path d="M8 3v3a2 2 0 01-2 2H3M21 8h-3a2 2 0 01-2-2V3M3 16h3a2 2 0 012 2v3M16 21v-3a2 2 0 012-2h3"/>
      </svg>
    </button>
  </div>

  <div class="mgp-card" id="mgpCard">
    <iframe
      class="mgp-iframe"
      src="{{ game_src }}"
      title="{{ _(game_title_key) }}"
      allowfullscreen
      sandbox="allow-scripts allow-same-origin allow-forms allow-modals">
    </iframe>
  </div>
</div>

<script>
(function() {
  function fwdKey(e) {
    var ifr = document.querySelector('.mgp-iframe');
    if (!ifr || !ifr.contentWindow) return;
    try {
      if (ifr.contentDocument && ifr.contentDocument.hasFocus()) return;
    } catch(err) { return; }
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) {
      e.preventDefault();
    }
    ifr.contentWindow.dispatchEvent(new KeyboardEvent(e.type, {
      bubbles: true, cancelable: true,
      key: e.key, code: e.code,
      keyCode: e.keyCode, which: e.which,
      shiftKey: e.shiftKey, ctrlKey: e.ctrlKey,
      altKey: e.altKey, metaKey: e.metaKey
    }));
  }
  document.addEventListener('keydown', fwdKey, true);
  document.addEventListener('keyup',   fwdKey, true);
})();

function mgpToggleFs() {
  var card = document.getElementById('mgpCard');
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    var req = card.requestFullscreen || card.webkitRequestFullscreen;
    if (req) req.call(card).catch(function(err){ console.warn('Fullscreen error:', err); });
  } else {
    var exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) exit.call(document);
  }
}
function _mgpUpdateFsIcon(isFs) {
  document.getElementById('mgpIconExpand').style.display = isFs ? 'none' : '';
  document.getElementById('mgpIconCollapse').style.display = isFs ? '' : 'none';
}
document.addEventListener('fullscreenchange', function(){ _mgpUpdateFsIcon(!!document.fullscreenElement); });
document.addEventListener('webkitfullscreenchange', function(){ _mgpUpdateFsIcon(!!document.webkitFullscreenElement); });
</script>
</body>
</html>
