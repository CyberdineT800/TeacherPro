{% extends "base.html" %}

{% block title %}{% if school %}{{ _('edit_school') }}{% else %}{{ _('new_school') }}{% endif %}{% endblock %}

{% block content %}
<div class="card form-card">
    <h2>{% if school %}{{ _('edit_school') }}{% else %}{{ _('new_school') }}{% endif %}</h2>

    <form method="POST">
        <div class="form-group">
            <label for="name">{{ _('name') }} *</label>
            <input type="text" id="name" name="name" value="{{ school.name if school else '' }}" required>
        </div>

        <div class="form-group">
            <label for="address">{{ _('address') }}</label>
            <textarea id="address" name="address" rows="3">{{ school.address if school else '' }}</textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="phone">{{ _('phone') }}</label>
                <input type="text" id="phone" name="phone" value="{{ school.phone if school else '' }}">
            </div>

            <div class="form-group">
                <label for="email">{{ _('email') }}</label>
                <input type="email" id="email" name="email" value="{{ school.email if school else '' }}">
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-success">{{ _('save') }}</button>
            <a href="{{ url_for('schools_list') }}" class="btn btn-secondary">{{ _('cancel') }}</a>
        </div>
    </form>
</div>
{% endblock %}
