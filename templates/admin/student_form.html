{% extends "base.html" %}

{% block title %}{% if student %}O'quvchini tahrirlash{% else %}Yangi o'quvchi{% endif %}{% endblock %}

{% block content %}
<div class="card">
    <h2>{% if student %}O'quvchini tahrirlash{% else %}Yangi o'quvchi{% endif %}</h2>
    
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label for="first_name">Ism *</label>
                <input type="text" id="first_name" name="first_name" value="{{ student.first_name if student else '' }}" required>
            </div>
            
            <div class="form-group">
                <label for="last_name">Familiya *</label>
                <input type="text" id="last_name" name="last_name" value="{{ student.last_name if student else '' }}" required>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="gender">Jins *</label>
                <select id="gender" name="gender" required>
                    <option value="">-- Tanlang --</option>
                    <option value="1" {% if student and student.gender == 1 %}selected{% endif %}>O'g'il</option>
                    <option value="2" {% if student and student.gender == 2 %}selected{% endif %}>Qiz</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="group_number">Guruh *</label>
                <select id="group_number" name="group_number" required>
                    <option value="">-- Tanlang --</option>
                    <option value="1" {% if student and student.group_number == 1 %}selected{% endif %}>1-guruh</option>
                    <option value="2" {% if student and student.group_number == 2 %}selected{% endif %}>2-guruh</option>
                </select>
            </div>
        </div>
        
        <div class="form-group">
            <label for="class_id">Sinf *</label>
            <select id="class_id" name="class_id" required>
                <option value="">-- Tanlang --</option>
                {% for class in classes %}
                <option value="{{ class.id }}" {% if student and student.class_id == class.id %}selected{% endif %}>
                    {{ class.name }} ({{ class.school.name }})
                </option>
                {% endfor %}
            </select>
        </div>
        
        <div style="margin-top: 2rem;">
            <button type="submit" class="btn btn-success">Saqlash</button>
            <a href="{% if student %}{{ url_for('students_list', class_id=student.class_id) }}{% else %}{{ url_for('students_list') }}{% endif %}" class="btn btn-secondary">Bekor qilish</a>
        </div>
    </form>
</div>
{% endblock %}
