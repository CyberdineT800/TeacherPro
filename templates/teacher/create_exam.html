{% extends "base.html" %}

{% block title %}Yangi imtihon yaratish{% endblock %}

{% block content %}
<div class="card">
    <h2>Yangi imtihon yaratish</h2>
    
    <form method="POST" id="exam_form">
        <div class="form-row">
            <div class="form-group">
                <label for="class_id">Sinf *</label>
                <select id="class_id" name="class_id" required onchange="updateGroupFilter()">
                    <option value="">-- Tanlang --</option>
                    {% for cls in classes %}
                    <option value="{{ cls.id }}">{{ cls.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="subject_id">Fan *</label>
                <select id="subject_id" name="subject_id" required>
                    <option value="">-- Tanlang --</option>
                    {% for subject in subjects %}
                    <option value="{{ subject.id }}">{{ subject.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="quarter_id">Chorak *</label>
                <select id="quarter_id" name="quarter_id" required>
                    <option value="">-- Tanlang --</option>
                    {% for quarter in quarters %}
                    <option value="{{ quarter.id }}">{{ quarter.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="exam_name_id">Imtihon nomi *</label>
                <select id="exam_name_id" name="exam_name_id" required>
                    <option value="">-- Tanlang --</option>
                    {% for exam_name in exam_names %}
                    <option value="{{ exam_name.id }}">{{ exam_name.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="exam_type_id">Imtihon turi *</label>
                <select id="exam_type_id" name="exam_type_id" required>
                    <option value="">-- Tanlang --</option>
                    {% for exam_type in exam_types %}
                    <option value="{{ exam_type.id }}">{{ exam_type.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <!-- <div class="form-group">
                <label for="group_filter">Guruh bo'yicha filtrlash</label>
                <select id="group_filter" name="group_filter">
                    <option value="all">Barcha guruhlar</option>
                    <option value="1">1-guruh</option>
                    <option value="2">2-guruh</option>
                </select>
                <small>Ballarni kiritish bosqichida tanlangan guruh ko'rsatiladi</small>
            </div> -->
        </div>
        
        <div class="form-group">
            <label for="num_questions">Savollar soni *</label>
            <input type="number" id="num_questions" name="num_questions" 
                   min="1" max="100" required onchange="generateQuestionFields()">
        </div>
        
        <!-- Hidden template for question types -->
        <select id="question_type_template" style="display: none;">
            <option value="">-- Tanlang --</option>
            {% for qt in question_types %}
            <option value="{{ qt.id }}">{{ qt.name }}</option>
            {% endfor %}
        </select>
        
        <div id="questions_container"></div>
        
        <div style="margin-top: 2rem;">
            <button type="submit" class="btn btn-success">Yaratish va balllarni kiritish</button>
            <a href="{{ url_for('teacher_dashboard') }}" class="btn btn-secondary">Bekor qilish</a>
        </div>
    </form>
</div>

<script>
function generateQuestionFields() {
    const numQuestions = document.getElementById('num_questions').value;
    const container = document.getElementById('questions_container');
    const template = document.getElementById('question_type_template');
    
    container.innerHTML = '';
    
    if (numQuestions > 0) {
        const questionHeader = document.createElement('h3');
        questionHeader.textContent = 'Savollar';
        container.appendChild(questionHeader);
        
        for (let i = 1; i <= numQuestions; i++) {
            const questionDiv = document.createElement('div');
            questionDiv.className = 'question-item';
            
            questionDiv.innerHTML = `
                <h4>${i}-savol</h4>
                <div class="form-row">
                    <div class="form-group">
                        <label for="question_type_${i}">Savol turi *</label>
                        <select id="question_type_${i}" name="question_type_${i}" required>
                            ${template.innerHTML}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="max_score_${i}">Maksimal ball *</label>
                        <input type="number" id="max_score_${i}" name="max_score_${i}" 
                               step="0.1" min="0.1" required>
                    </div>
                </div>
            `;
            
            container.appendChild(questionDiv);
        }
    }
}

function updateGroupFilter() {
    const classId = document.getElementById('class_id').value;
    const groupFilter = document.getElementById('group_filter');
    
    if (classId) {
        // Guruh filtri faollashtiriladi
        groupFilter.disabled = false;
    } else {
        // Sinf tanlanmagan, guruh filtri bloklanadi
        groupFilter.disabled = true;
        groupFilter.value = 'all';
    }
}

// Auto-generate question fields on page load if num_questions has value
document.addEventListener('DOMContentLoaded', function() {
    const numQuestions = document.getElementById('num_questions');
    if (numQuestions && numQuestions.value) {
        generateQuestionFields();
    }
    
    // Guruh filtri dastlabki holatini sozlash
    updateGroupFilter();
});
</script>
{% endblock %}
