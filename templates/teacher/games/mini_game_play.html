{% extends "base.html" %}
{% block title %}{{ _(game_title_key) }} — {{ _('games') }}{% endblock %}

{% block extra_css %}
<style>
.mgp-wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 1.25rem 1.5rem 2rem;
}

.mgp-bar {
    display: flex;
    align-items: center;
    gap: .75rem;
    margin-bottom: 1rem;
    flex-wrap: wrap;
}

.mgp-back {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    padding: .35rem .85rem;
    border-radius: var(--r-pill);
    font-size: .84rem;
    font-weight: 600;
    color: var(--c-cyan);
    border: 1px solid rgba(100,200,255,.25);
    background: rgba(100,200,255,.07);
    text-decoration: none;
    transition: background .18s, border-color .18s;
}
.mgp-back:hover {
    background: rgba(100,200,255,.14);
    border-color: var(--c-cyan);
    color: var(--c-cyan);
}
.mgp-back svg { flex-shrink: 0; }

.mgp-title {
    font-size: 1rem;
    font-weight: 700;
    margin: 0;
    color: var(--text);
}

.mgp-badge {
    font-size: .73rem;
    font-weight: 700;
    padding: .18rem .6rem;
    border-radius: var(--r-pill);
    background: rgba(100,200,255,.1);
    color: var(--c-cyan);
    border: 1px solid rgba(100,200,255,.3);
    text-transform: uppercase;
    letter-spacing: .04em;
    margin-left: auto;
}

.mgp-fs-btn {
    flex-shrink: 0;
    padding: .4rem .55rem;
    border-radius: var(--r-sm);
    background: rgba(100,200,255,.1);
    border: 1px solid rgba(100,200,255,.25);
    color: var(--c-cyan);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background .15s;
}
.mgp-fs-btn:hover { background: rgba(100,200,255,.2); }

/* Game card */
.mgp-card {
    position: relative;
    border-radius: var(--r-lg);
    border: 1px solid var(--glass-border-strong);
    background: var(--glass-bg);
    box-shadow: var(--sh-lg);
    overflow: hidden;
    height: calc(100vh - 175px);
    min-height: 400px;
}

.mgp-card:fullscreen,
.mgp-card:-webkit-full-screen {
    border-radius: 0;
    height: 100vh;
    width: 100vw;
}

.mgp-iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: #fff;
    display: block;
}
</style>
{% endblock %}

{% block content %}
<div class="mgp-wrap">
    <div class="mgp-bar">
        <a href="{{ root_path }}/teacher/games" class="mgp-back">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
            {{ _('back_to_games') }}
        </a>
        <h2 class="mgp-title">{{ _(game_title_key) }}</h2>
        <span class="mgp-badge">{{ _('mini_game_label') }}</span>
        <button class="mgp-fs-btn" id="mgpFsBtn" onclick="mgpToggleFs()" title="Fullscreen">
            <svg id="mgpIconExpand" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 7V3h4M21 7V3h-4M3 17v4h4M21 17v4h-4"/>
            </svg>
            <svg id="mgpIconCollapse" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                <path d="M8 3v3a2 2 0 01-2 2H3M21 8h-3a2 2 0 01-2-2V3M3 16h3a2 2 0 012 2v3M16 21v-3a2 2 0 012-2h3"/>
            </svg>
        </button>
    </div>

    <div class="mgp-card" id="mgpCard">
        <iframe
            class="mgp-iframe"
            src="{{ game_src }}"
            title="{{ _(game_title_key) }}"
            allowfullscreen
            sandbox="allow-scripts allow-same-origin allow-forms allow-modals">
        </iframe>
    </div>
</div>

<script>
// Forward keyboard events from parent page into the iframe so arrow keys
// always work even when the user clicks outside the game frame.
(function() {
    function fwdKey(e) {
        var ifr = document.querySelector('.mgp-iframe');
        if (!ifr || !ifr.contentWindow) return;
        try {
            if (ifr.contentDocument && ifr.contentDocument.hasFocus()) return;
        } catch(err) { return; }
        // Prevent the parent page from scrolling on arrow keys
        if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) {
            e.preventDefault();
        }
        ifr.contentWindow.dispatchEvent(new KeyboardEvent(e.type, {
            bubbles: true, cancelable: true,
            key: e.key, code: e.code,
            keyCode: e.keyCode, which: e.which,
            shiftKey: e.shiftKey, ctrlKey: e.ctrlKey,
            altKey: e.altKey, metaKey: e.metaKey
        }));
    }
    document.addEventListener('keydown', fwdKey, true);
    document.addEventListener('keyup',   fwdKey, true);
})();

function mgpToggleFs() {
    const card = document.getElementById('mgpCard');
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        const req = card.requestFullscreen || card.webkitRequestFullscreen;
        if (req) req.call(card).catch(err => console.warn('Fullscreen error:', err));
    } else {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) exit.call(document);
    }
}

function _mgpUpdateFsIcon(isFs) {
    document.getElementById('mgpIconExpand').style.display = isFs ? 'none' : '';
    document.getElementById('mgpIconCollapse').style.display = isFs ? '' : 'none';
}

document.addEventListener('fullscreenchange', () => _mgpUpdateFsIcon(!!document.fullscreenElement));
document.addEventListener('webkitfullscreenchange', () => _mgpUpdateFsIcon(!!document.webkitFullscreenElement));
</script>
{% endblock %}
