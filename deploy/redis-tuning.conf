# ══════════════════════════════════════════════════════════════════════════
#  TeacherPro — Redis tuning (pure cache, no persistence)
#
#  Apply: sudo tee -a /etc/redis/redis.conf < redis-tuning.conf
#  Then:  systemctl restart redis
#
#  Or append these lines manually to /etc/redis/redis.conf
# ══════════════════════════════════════════════════════════════════════════

# ── Memory limit — 1 GB for cache (leaves 7 GB for app + PG + OS)
maxmemory 1gb

# ── Eviction policy: when maxmemory is reached, evict least-recently-used keys
# allkeys-lru: evict any key (not just those with TTL) — best for pure cache
maxmemory-policy allkeys-lru

# ── Disable persistence — this is a cache, not a store
# If Redis restarts, the app gracefully falls back to DB queries
save ""
appendonly no

# ── TCP performance
tcp-backlog 511
tcp-keepalive 300

# ── Connection limits
maxclients 200

# ── Lazy freeing (delete large keys in background, avoids blocking)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes

# ── Logging
loglevel notice
