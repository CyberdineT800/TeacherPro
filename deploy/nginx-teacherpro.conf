# ══════════════════════════════════════════════════════════════════════════
#  teacherpro.uz — nginx configuration
#  HTTP → HTTPS redirect + optimised HTTPS with gzip, HTTP/2, rate limiting
# ══════════════════════════════════════════════════════════════════════════

# ── Rate limiting zones (defined in http context — add to nginx.conf if not already there)
# Place these inside the http { } block in /etc/nginx/nginx.conf:
#
#   limit_req_zone  $binary_remote_addr  zone=general:10m  rate=30r/s;
#   limit_req_zone  $binary_remote_addr  zone=auth:10m     rate=5r/m;
#   limit_conn_zone $binary_remote_addr  zone=connlimit:10m;
#
# ─────────────────────────────────────────────────────────────────────────

# ── Upstream: HTTP workers (3x gunicorn)
upstream teacherpro_http {
    server unix:/run/teacherpro/http.sock;
    keepalive 64;
}

# ── Upstream: WebSocket worker (1x dedicated gunicorn)
upstream teacherpro_ws {
    server unix:/run/teacherpro/ws.sock;
}

# ══════════════════════════════════════════════
#  HTTP → HTTPS redirect
# ══════════════════════════════════════════════
server {
    listen 80;
    listen [::]:80;
    server_name teacherpro.uz www.teacherpro.uz;

    # Let's Encrypt renewal
    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/html/.well-known/acme-challenge/;
        try_files $uri =404;
        default_type "text/plain";
    }

    location / {
        return 301 https://teacherpro.uz$request_uri;
    }
}

# ══════════════════════════════════════════════
#  HTTPS — main server block
# ══════════════════════════════════════════════
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name teacherpro.uz www.teacherpro.uz;

    # ── SSL
    ssl_certificate     /etc/letsencrypt/live/teacherpro.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teacherpro.uz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── OCSP stapling
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout    5s;

    # ── www → apex redirect
    if ($host = www.teacherpro.uz) {
        return 301 https://teacherpro.uz$request_uri;
    }

    # ── Gzip compression
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        text/html
        text/xml
        application/xml
        image/svg+xml
        font/woff2
        font/woff;

    # ── Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "SAMEORIGIN"                                  always;
    add_header X-Content-Type-Options     "nosniff"                                     always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"             always;
    add_header X-XSS-Protection           "1; mode=block"                               always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()"    always;

    # ── Per-connection limit (max 30 concurrent connections per IP)
    limit_conn connlimit 30;

    # ── Client upload limit (announcements, profile images)
    client_max_body_size 20M;

    # ── Timeouts
    proxy_connect_timeout  10s;
    proxy_read_timeout    120s;
    proxy_send_timeout    120s;

    # ── Static files — served directly by nginx (fastest path)
    location /static/ {
        alias   /var/www/teacherpro/current/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
        gzip_static on;
        # Security: no need to follow symlinks
        disable_symlinks on;
    }

    # ── Uploaded images — shorter cache TTL (may change)
    location /static/uploads/ {
        alias   /var/www/teacherpro/current/static/uploads/;
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Student WebSocket (game play) → dedicated WS worker
    location ~ ^/play/quiz-race/[^/]+/ws {
        proxy_pass         http://teacherpro_ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout   10s;
        access_log off;
    }

    # ── Teacher WebSocket (game control) → dedicated WS worker
    location ~ ^/teacher/games/quiz-race/[^/]+/ws {
        proxy_pass         http://teacherpro_ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout   10s;
        access_log off;
    }

    # ── Authentication — strict rate limit
    location /login {
        limit_req zone=auth burst=15 nodelay;
        proxy_pass         http://teacherpro_http;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
    }

    # ── All other requests → HTTP workers (with general rate limit)
    location / {
        limit_req zone=general burst=150 nodelay;

        proxy_pass         http://teacherpro_http;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        # keepalive reuse
        proxy_set_header   Connection        "";
    }
}
