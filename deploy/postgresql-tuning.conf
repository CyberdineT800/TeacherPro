# ══════════════════════════════════════════════════════════════════════════
#  TeacherPro — PostgreSQL 16 performance tuning
#  Server: Hetzner CPX32 — 4 vCPU, 8 GB RAM, NVMe SSD
#
#  Drop this file in /etc/postgresql/16/main/conf.d/teacherpro.conf
#  Then run: systemctl restart postgresql
# ══════════════════════════════════════════════════════════════════════════

# ── Memory (8 GB RAM)
# 25% of RAM for shared_buffers — optimal for dedicated DB server
shared_buffers = 2GB

# Hint to the query planner about total OS-level cache available
effective_cache_size = 6GB

# Per-sort / per-hash operation memory (applies per node, per query)
work_mem = 16MB

# For VACUUM, CREATE INDEX, ALTER TABLE — can use more RAM
maintenance_work_mem = 256MB

# WAL buffers — 3% of shared_buffers, max 64MB
wal_buffers = 64MB

# ── Connections
# Supports 4 gunicorn workers × 15 pool slots = 60 connections + headroom
max_connections = 200

# ── NVMe SSD optimisations
# Much lower random vs sequential cost on SSDs (default 4.0 is for spinning disks)
random_page_cost = 1.1
seq_page_cost    = 1.0

# Concurrent I/O requests the OS can handle simultaneously (NVMe can handle many)
effective_io_concurrency = 200
maintenance_io_concurrency = 200

# ── Checkpoint tuning (reduces I/O spikes)
checkpoint_completion_target = 0.9
checkpoint_timeout           = 10min
max_wal_size                 = 2GB
min_wal_size                 = 256MB

# ── Parallelism (4 vCPU)
max_worker_processes              = 4
max_parallel_workers              = 4
max_parallel_workers_per_gather   = 2
max_parallel_maintenance_workers  = 2

# ── Safety timeouts (prevent runaway queries / stuck transactions)
# Kill queries that run longer than 30 seconds
statement_timeout = 30000

# Kill transactions that are idle (open but doing nothing) for 60 seconds
idle_in_transaction_session_timeout = 60000

# ── Slow query logging (find performance bottlenecks)
# Log queries that take longer than 1 second
log_min_duration_statement = 1000

# ── JIT (disable for OLTP — adds latency for short queries)
jit = off

# ── Autovacuum tuning (more aggressive for active tables)
autovacuum_vacuum_scale_factor  = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_delay    = 2ms
autovacuum_max_workers          = 3
